<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecureRepo | Audit Trail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex">
    <nav class="sidebar d-flex flex-column p-3">
        <div class="text-center mb-4 pt-3">
            <i class="fas fa-shield-halved fa-2x text-info"></i>
            <h5 class="mt-2 fw-bold text-info">SECURE REPO</h5>
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
            <li><a href="{{ url_for('dashboard') }}" class="nav-link"><i class="fas fa-folder-open"></i> Repository</a></li>
            <li><a href="{{ url_for('manage_users') }}" class="nav-link"><i class="fas fa-users-cog"></i> Manage Users</a></li>
            <li><a href="{{ url_for('view_logs') }}" class="nav-link active"><i class="fas fa-list-check"></i> Audit Logs</a></li>
        </ul>
        <hr class="text-secondary">
        <div class="px-3 pb-3">
            <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm w-100"><i class="fas fa-sign-out-alt me-2"></i>Sign Out</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="container-fluid">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold"><i class="fas fa-terminal text-info me-2"></i>System Audit Trail</h3>
                    <p class="text-secondary">Real-time tracking of file access and administrative actions.</p>
                </div>
                <a href="{{ url_for('export_logs') }}" class="btn btn-outline-info">
                    <i class="fas fa-file-export me-2"></i>Export Logs (.txt)
                </a>
            </header>

            <div class="card p-4 shadow-sm bg-dark border-secondary">
                <div class="d-flex align-items-center mb-3 text-secondary border-bottom border-secondary pb-2">
                    <small class="text-uppercase fw-bold letter-spacing-1">System Terminal Output</small>
                </div>
    
                <div class="terminal-output">
                    {% for log in logs %}
                        <div class="log-entry">
                            <i class="fas fa-terminal me-2 opacity-50"></i> {{ log }}
                        </div>
                    {% endfor %}
        
                    {% if not logs %}
                        <p class="text-center py-5 text-muted italic">No log entries found.</p>
                    {% endif %}
    </div>
</div>
        </div>
    </main>
</body>
</html>
