<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Repo - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card login-card p-4 shadow-lg">
            <div class="text-center">
                <div class="mb-3">
                    <i class="fas fa-shield-halved fa-3x text-info"></i>
                </div>
                <h2 class="login-title mb-1">SECURE REPO</h2>
                <p class="text-secondary small mb-4">Identity Verification Required</p>
            </div>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="alert alert-danger py-2" role="alert" style="font-size: 0.85rem;">
                      <i class="fas fa-exclamation-circle me-2"></i>{{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label small text-uppercase fw-bold opacity-75">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary border-end-0">
                            <i class="fas fa-user text-secondary"></i>
                        </span>
                        <input type="text" name="username" class="form-control bg-transparent text-white border-secondary border-start-0" placeholder="Enter username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small text-uppercase fw-bold opacity-75">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary border-end-0">
                            <i class="fas fa-lock text-secondary"></i>
                        </span>
                        <input type="password" name="password" class="form-control bg-transparent text-white border-secondary border-start-0" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">
                    LOG IN <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </form>

            <div class="text-center mt-2">
                <p style="font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px;">
                    Encrypted Portal v2.0
                </p>
            </div>
        </div>
    </div>
</body>
</html>
